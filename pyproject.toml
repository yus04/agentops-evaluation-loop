[project]
name = "agentops-evaluation-loop"
version = "0.1.0"
description = "LangGraph 注文サポートエージェントの観測 (Langfuse/OTel) → 評価 (DeepEval) → 最適化 (GEPA) → 回帰テストのループ"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    # --- Agent runtime ---
    "langgraph>=0.2.60",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.2.0",
    # --- Observability ---
    "langfuse>=3.0.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    # --- Serving / config / CLI ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "typer>=0.15.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# 評価バッチ (GitHub Actions) 用。本番コンテナには入れない。
eval = [
    "deepeval>=3.0.0",
]
# 最適化バッチ (GitHub Actions) 用。
optimize = [
    "gepa>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
agentops = "agentops_loop.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentops_loop"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
